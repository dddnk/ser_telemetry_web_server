<!DOCTYPE html>
<html>
	<head>
		<title>
			feed
		</title>
		<style>
		:root {
			--background-colour: #00a;
			--foreground-colour: #fe0;
		}
		::selection {
			background-color: var(--foreground-colour);
			color: var(--background-colour);
		}
		body {
			font-family: sans-serif;
			background-color: var(--background-colour);
			color: var(--foreground-colour);
		}
		#termbox {
			border: 1px solid var(--foreground-colour);
			overflow-y:scroll;
			flex-grow: 1;
		}
		#svg-wrapper {
			border: 1px solid var(--foreground-colour);
			width: 40vw;
			flex-grow: 1;
		}
		#svg-wrapper svg {
			width: 100%;
			height:auto;
		}
		#container {
			display:flex;
			flex-flow: row nowrap;
			align-content: stretch;
		}
		</style>
	</head>
	<body>
		<h1>
			Example feed
		</h1>
		<div id="container">
			<div id="termbox">
			[#vals]
			</div>
			<div id="svg-wrapper">
				[#graph]
			</div>
		</div>
	</body>
</html>
